# Aztec Sequencer Alert Rules — critical / page-worthy only
#
# Node-operator policy: we ONLY alert on conditions that warrant waking
# someone up. Everything that was previously "warning" or "info" (soft balance,
# blob/proposal/attestation failures, slot fill, reorgs, geth peer/sync/stall,
# provider keystore queue, etc.) has been removed — watch those on the Grafana
# dashboard instead. Each alert below is severity: critical and should page.
#
# Metric names cross-checked against the ACTUAL aztec-packages source, Aztec's
# own production monitoring, AND the official V5 monitoring installer
# (docs.aztec.network/scripts/aztec-monitoring.sh, verified against live
# v5.0.0 nodes). Works on both the v4 line and V5:
#   aztec_l1_balance_eth                    (V5 gauge — exists from node startup)
#   aztec_l1_publisher_balance_eth          (gauge, 'eth' suffix — v4 fallback,
#                                            only emitted once proposing starts)
#   aztec_archiver_block_height             (gauge, split by aztec_status)
#   aztec_world_state_critical_error_count  (counter)
#   aztec_geth_up                           (pushgateway gauge from check-geth-health.sh)
#
# Node scrape-job convention: the Aztec node targets are scraped under ONE job
# named "aztec-node" (the official installer's convention; see prometheus.yml),
# with a pinned per-target `instance` label naming each node. AztecNodeDown
# keys off that job name — rename it if your scrape config differs.
#
# IMPORTANT: aztec_archiver_block_height is split by the aztec_status attribute
# (values: proposed / proven / finalized). There is NO empty-string series, so a
# selector like {aztec_status=""} matches nothing and an alert built on it never
# fires. Use aztec_status="proposed" for the chain tip - this is exactly what
# Aztec's own "Chain - no new blocks" alert uses.

groups:
  - name: aztec_critical
    rules:
      # Node metrics endpoint unreachable - node process, collector, or machine
      # is down. Without this, a dead node makes every OTEL-based alert below
      # go STALE (their series vanish) and nothing would ever page.
      # `up` is scrape-target health, so this cannot fire on phantom data.
      # (The official installer pages after 2m; we allow 5m to ride out
      # transient network blips between monitoring machine and node.)
      - alert: AztecNodeDown
        expr: up{job="aztec-node"} == 0
        for: 5m
        labels:
          severity: critical
          component: node
        annotations:
          summary: "Aztec node down ({{ $labels.instance }}{{ if $labels.host }} on {{ $labels.host }}{{ end }})"
          description: "Prometheus cannot scrape {{ $labels.instance }}'s metrics endpoint. The node or its OTEL collector is down, or port 8889 is unreachable."
          runbook: "Check the node machine, `docker compose ps`, and firewall/connectivity to :8889"

      # Publisher running out of ETH - can't submit blocks without it.
      # aztec_l1_balance_eth (V5) exists from node startup, so an underfunded
      # account pages immediately; aztec_l1_publisher_balance_eth is the v4
      # fallback (only emitted once the node starts proposing). On nodes that
      # emit both, Alertmanager's group_by alertname collapses them to one page.
      - alert: LowL1PublisherBalance
        expr: (aztec_l1_balance_eth or aztec_l1_publisher_balance_eth) < 0.2
        for: 5m
        labels:
          severity: critical
          component: publisher
        annotations:
          summary: "Publisher ETH critically low ({{ $labels.instance }}{{ if $labels.host }} on {{ $labels.host }}{{ end }})"
          description: "Balance is {{ $value }} ETH on {{ $labels.instance }}. Refill immediately."
          runbook: "Top up publisher address with at least 1 ETH"

      # Node stuck - not processing blocks.
      # aztec_status="proposed" = chain tip (matches Aztec's own no-new-blocks alert).
      - alert: L2BlockHeightNotIncreasing
        expr: increase(aztec_archiver_block_height{aztec_status="proposed"}[15m]) == 0
        for: 5m
        labels:
          severity: critical
          component: archiver
        annotations:
          summary: "No L2 blocks in 15m ({{ $labels.instance }}{{ if $labels.host }} on {{ $labels.host }}{{ end }})"
          description: "{{ $labels.instance }} has not advanced the proposed tip in 15m. May be stuck or out of sync."
          runbook: "Check archiver logs, verify L1 RPC, consider restart"

      # World state corruption / fatal DB error - node cannot build or sync safely.
      - alert: WorldStateCriticalError
        expr: increase(aztec_world_state_critical_error_count[15m]) > 0
        for: 1m
        labels:
          severity: critical
          component: world_state
        annotations:
          summary: "World state critical error ({{ $labels.instance }}{{ if $labels.host }} on {{ $labels.host }}{{ end }})"
          description: "{{ $value }} critical world-state error(s) on {{ $labels.instance }} in 15m."
          runbook: "Check node logs for world-state errors; may need resync from snapshot"

      # Geth (local L1 execution client) down - the sequencer can't do L1 ops.
      # Gated on push_time_seconds freshness so a dead check-geth-health.sh cron
      # (rather than an actually-down geth) can NEVER raise a page on stale data.
      #
      # The bare `and` (no on() clause) matches on the FULL label set. That is
      # deliberate: aztec_geth_up and its group's push_time_seconds come from
      # the same Pushgateway group, so their labels are identical however the
      # gateway is scraped:
      #   - directly with honor_labels: true (this repo's prometheus.yml):
      #     both sides carry job="aztec_geth", instance="local"
      #   - through an aggregating hub with honor_labels: false (e.g.
      #     StakerSpace/monitoring-stack-ansible): both sides carry the target
      #     labels (job/instance/host/...) plus exported_job="aztec_geth",
      #     exported_instance="local"
      # Either way the other push groups (aztec_publisher, aztec_provider,
      # aztec_delegations) differ in job/exported_job so their freshness can
      # never satisfy this gate. The previous `and on(job, instance)` form
      # broke that behind a hub scrape: every group on a gateway shares the
      # same scrape-level job/instance there, so ANY fresh group (e.g. the
      # 30-minute balance check) could vouch for a stale aztec_geth_up.
      # (Scraping several nodes' gateways directly with honor_labels: true is
      # broken regardless of this expression — the pushed job="aztec_geth",
      # instance="local" collide across nodes at ingestion; give each
      # pushgateway target distinguishing labels, or scrape via a hub.)
      #
      # CONSTRAINT: check-geth-health.sh must keep pushing aztec_geth_up with
      # NO per-metric labels. An extra label on the metric (absent from the
      # group's push_time_seconds) would make the full-label match fail and
      # this alert go permanently silent (fails closed, never falsely pages).
      - alert: GethDown
        expr: aztec_geth_up == 0 and (time() - push_time_seconds < 900)
        for: 5m
        labels:
          severity: critical
          component: geth
        annotations:
          summary: "Geth is down{{ if $labels.host }} on {{ $labels.host }}{{ end }}"
          description: "The geth health check reports the node as down (fresh data)."
          runbook: "Check geth process, RPC, and logs"
