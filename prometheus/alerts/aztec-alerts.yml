# Aztec Sequencer Alert Rules — critical / page-worthy only
#
# Node-operator policy: we ONLY alert on conditions that warrant waking
# someone up. Everything that was previously "warning" or "info" (soft balance,
# blob/proposal/attestation failures, slot fill, reorgs, geth peer/sync/stall,
# provider keystore queue, etc.) has been removed — watch those on the Grafana
# dashboard instead. Each alert below is severity: critical and should page.
#
# Metric names cross-checked against the ACTUAL aztec-packages source AND
# Aztec's own production monitoring on master (latest release line
# v4.1.2 / v4.2.0-nightly):
#   aztec_l1_publisher_balance_eth          (gauge, 'eth' suffix)
#   aztec_archiver_block_height             (gauge, split by aztec_status)
#   aztec_world_state_critical_error_count  (counter)
#   aztec_geth_up                           (pushgateway gauge from check-geth-health.sh)
#
# IMPORTANT: aztec_archiver_block_height is split by the aztec_status attribute
# (values: proposed / proven / finalized). There is NO empty-string series, so a
# selector like {aztec_status=""} matches nothing and an alert built on it never
# fires. Use aztec_status="proposed" for the chain tip - this is exactly what
# Aztec's own "Chain - no new blocks" alert uses.

groups:
  - name: aztec_critical
    rules:
      # Publisher running out of ETH - can't submit blocks without it
      - alert: LowL1PublisherBalance
        expr: aztec_l1_publisher_balance_eth < 0.2
        for: 5m
        labels:
          severity: critical
          component: publisher
        annotations:
          summary: "Publisher ETH critically low ({{ $labels.job }})"
          description: "Balance is {{ $value }} ETH on {{ $labels.job }}. Refill immediately."
          runbook: "Top up publisher address with at least 1 ETH"

      # Node stuck - not processing blocks.
      # aztec_status="proposed" = chain tip (matches Aztec's own no-new-blocks alert).
      - alert: L2BlockHeightNotIncreasing
        expr: increase(aztec_archiver_block_height{aztec_status="proposed"}[15m]) == 0
        for: 5m
        labels:
          severity: critical
          component: archiver
        annotations:
          summary: "No L2 blocks in 15m ({{ $labels.job }})"
          description: "{{ $labels.job }} has not advanced the proposed tip in 15m. May be stuck or out of sync."
          runbook: "Check archiver logs, verify L1 RPC, consider restart"

      # World state corruption / fatal DB error - node cannot build or sync safely.
      - alert: WorldStateCriticalError
        expr: increase(aztec_world_state_critical_error_count[15m]) > 0
        for: 1m
        labels:
          severity: critical
          component: world_state
        annotations:
          summary: "World state critical error ({{ $labels.job }})"
          description: "{{ $value }} critical world-state error(s) on {{ $labels.job }} in 15m."
          runbook: "Check node logs for world-state errors; may need resync from snapshot"

      # Geth (local L1 execution client) down - the sequencer can't do L1 ops.
      # Gated on push_time_seconds freshness so a dead check-geth-health.sh cron
      # (rather than an actually-down geth) can NEVER raise a page on stale data.
      - alert: GethDown
        expr: aztec_geth_up == 0 and on(job, instance) (time() - push_time_seconds < 900)
        for: 5m
        labels:
          severity: critical
          component: geth
        annotations:
          summary: "Geth is down"
          description: "The geth health check reports the node as down (fresh data)."
          runbook: "Check geth process, RPC, and logs"
