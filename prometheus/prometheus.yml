# Prometheus Configuration for Aztec Sequencer Monitoring
#
# Aztec node scraping follows the convention of the official monitoring
# installer (https://docs.aztec.network/operate/operators/concepts/monitoring):
#   - ONE job named "aztec-node" for all Aztec nodes
#   - one static_configs block per node, each with a PINNED `instance` label
#
# Why pin `instance`? The node generates a random service.instance.id at every
# boot; if the dashboard series were named by it, every restart would start new
# series (discontinuity). A target-level `instance` label (with the default
# honor_labels: false) overrides that permanently — the node's generated id is
# preserved as `exported_instance`. Pick a distinct, durable value per node and
# never change it.
#
# Nodes are distinguished by `instance` (and optional `network`/`role` labels);
# nodes deployed with StakerSpace/aztec-sequencer-ansible expose the collector
# on <node-ip>:8889 out of the box.
#
# Scrape targets:
#   1. OTEL Collectors (port 8889) - Aztec node metrics exported via OpenTelemetry
#      Exposes: aztec_archiver_*, aztec_sequencer_*, aztec_l1_*, aztec_peer_manager_*,
#               aztec_db_*, aztec_fisherman_*, aztec_ivc_verifier_*, etc.
#
#   2. Geth (port 6060) - Local execution layer client metrics
#      Exposes: eth_*, chain_*, p2p_*, txpool_*, system metrics
#
#   3. Lighthouse (port 5054) - Consensus layer client metrics
#      Exposes: beacon_*, libp2p_*, sync_*, validator_*, slot_*, epoch_*
#
#   4. Pushgateway (port 9091) - Custom metrics pushed by cron scripts
#      Exposes: aztec_geth_up, aztec_geth_block_number, aztec_publisher_balance_eth, etc.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "recording-rules.yml"
  - "alerts/*.yml"

scrape_configs:
  # ── Aztec Nodes (via each node's OTEL Collector) ─────────────────────
  # One job for all nodes; one block per node with a pinned instance label.
  # Adjust targets to your deployment (container name, host IP, or node IP).
  - job_name: "aztec-node"
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      # Mainnet - Active sequencer
      - targets: ["otel-collector:8889"]
        labels:
          instance: "sequencer-mainnet-1"   # stable name — keep it forever
          network: "mainnet"
          role: "active"

      # Mainnet - Redundant sequencer (standby)
      # Uncomment and set the correct target when the redundant node is deployed.
      # - targets: ["<redundant-node-ip>:8889"]
      #   labels:
      #     instance: "sequencer-mainnet-2"
      #     network: "mainnet"
      #     role: "redundant"

      # Testnet sequencer
      # Uncomment and set the correct target when the testnet node is deployed.
      # - targets: ["<testnet-node-ip>:8889"]
      #   labels:
      #     instance: "sequencer-testnet-1"
      #     network: "testnet"
      #     role: "active"

  # ── Geth (Execution Layer) ───────────────────────────────────────────
  - job_name: "geth"
    scrape_interval: 15s
    metrics_path: /debug/metrics/prometheus
    static_configs:
      - targets: ["geth:6060"]
        labels:
          instance: "geth-local"

  # ── Lighthouse (Consensus Layer) ─────────────────────────────────────
  - job_name: "lighthouse"
    scrape_interval: 15s
    static_configs:
      - targets: ["lighthouse:5054"]
        labels:
          instance: "lighthouse-local"

  # ── Pushgateway (Custom Script Metrics) ──────────────────────────────
  - job_name: "pushgateway"
    honor_labels: true
    scrape_interval: 15s
    static_configs:
      - targets: ["pushgateway:9091"]

  # ── OTEL Collector Self-Metrics (optional) ───────────────────────────
  # The collector's own health metrics live on port 8888 INSIDE the collector
  # container and are not exposed by the default node deployment (neither the
  # official installer nor aztec-sequencer-ansible publishes 8888). Enable
  # only if you expose it yourself; primary collector-down signal is
  # up{job="aztec-node"} == 0 either way.
  # - job_name: "otel-collector"
  #   scrape_interval: 30s
  #   static_configs:
  #     - targets: ["<node-ip>:8888"]
  #       labels:
  #         instance: "otel-collector-mainnet-1"
