# Example Alertmanager routing for the Aztec monitoring alerts.
#
# This stack now defines ONLY critical, page-worthy alerts (node-operator
# policy — everything softer is watched on the Grafana dashboard, not paged).
# So routing is simple: every alert is severity=critical and goes to PagerDuty.
#
# The critical (page-worthy) alerts are:
#   AztecNodeDown, LowL1PublisherBalance, L2BlockHeightNotIncreasing,
#   L1BlockHeightNotIncreasing, WorldStateCriticalError, GethBlockStalled,
#   OwnValidatorSlashingVotesHigh, OwnValidatorSlashed
#
# Usage: copy to alertmanager.yml, fill in the secrets, validate, and reload:
#   amtool check-config alertmanager.yml
#   curl -X POST http://localhost:9093/-/reload

global:
  resolve_timeout: 5m

route:
  receiver: pagerduty-critical
  group_by: ['alertname', 'job', 'instance']
  group_wait: 10s                 # page fast
  group_interval: 5m
  repeat_interval: 1h             # re-page hourly while unresolved

receivers:
  - name: pagerduty-critical
    pagerduty_configs:
      - routing_key: "<YOUR_PAGERDUTY_EVENTS_V2_ROUTING_KEY>"
        severity: critical
        description: '{{ .CommonAnnotations.summary }}'
        details:
          runbook: '{{ .CommonAnnotations.runbook }}'
          firing: '{{ .Alerts.Firing | len }} alert(s)'

inhibit_rules:
  # A node that stopped seeing L1 blocks will also stop advancing its L2 tip;
  # page once for the L1 outage (the cause), not again for the symptom.
  - source_matchers: [ 'alertname = "L1BlockHeightNotIncreasing"' ]
    target_matchers: [ 'alertname = "L2BlockHeightNotIncreasing"' ]
    equal: ['job', 'instance']

  # A dead node (scrape target down) briefly overlaps with the OTEL-based
  # alerts before their series go stale and resolve; page once for the node,
  # not once per symptom.
  - source_matchers: [ 'alertname = "AztecNodeDown"' ]
    target_matchers: [ 'severity = "critical"', 'component =~ "archiver|publisher|world_state" ' ]
    equal: ['job', 'instance']
